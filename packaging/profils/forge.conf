# Forge — exemple livre par le depot (issue #74)
#
# Des teintes chaudes, la braise du catalogue, et une zone : les trois
# ventilateurs du radiateur gardent une couleur fixe pendant que le reste du
# boitier respire. C'est ce qu'une zone sait faire de plus qu'une couleur.
#
# Copie dans /var/lib/reverb/profils/ a l'installation, s'il n'y est pas deja.
# Modifie-le : une seconde installation ne l'ecrasera pas.

ventilateur bas-gauche 4a0f00
ventilateur bas-milieu 5c1400
ventilateur bas-droite 6e1c00
ventilateur radiateur-haut 8f2c00
ventilateur radiateur-milieu a03400
ventilateur radiateur-bas 802400
ventilateur arriere 3a0b00
ventilateur haut-gauche c24400
ventilateur haut-milieu d34c00
ventilateur haut-droite e45400
barrette 0 a03000
barrette 1 b43800
barrette 2 c84000
barrette 3 dc4800
animation braise couleur=ff5a00 vitesse=2 direction=bas-haut
zone radiateur fan:radiateur-haut,fan:radiateur-milieu,fan:radiateur-bas
light radiateur ff8c1a
brightness 25
affiche rien
