[package]
name = "reverb-daemon"
version = "0.1.0"
description = "Démon Reverb — détient les périphériques et fait tourner la boucle de rendu"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "reverb_daemon"
path = "src/lib.rs"

[[bin]]
name = "reverbd"
path = "src/main.rs"

[dependencies]
reverb-anim = { path = "../reverb-anim" }
reverb-proto = { path = "../reverb-proto" }
reverb-hw = { path = "../reverb-hw" }

[lints]
workspace = true
